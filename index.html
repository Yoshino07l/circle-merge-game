<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e8">
  <meta name="description" content="拖动瞄准，松手投放。相同等级的圆圆碰到一起，就会合成更大的圆圆。">
  <title>合成圆圆</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f6f2e8'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%23e9cf65' stroke='%233d443c' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js?v=photos-20261006"></script>
  <script defer src="physics.js?v=photos-20261006"></script>
  <script defer src="game.js?v=photos-20261006"></script>
</head>
<body>
  <main class="game-layout">
    <section class="play-column" aria-label="游戏区域">
      <div class="board-topline"><span><i class="tiny-circle" aria-hidden="true"></i> 落下，碰见，合成。</span><span id="highestLevel">最高等级 01</span></div>
      <div class="board-frame" id="stage">
        <canvas id="game" width="420" height="700" tabindex="0" aria-label="合成棋盘。左右方向键瞄准，空格投放。">请使用支持 Canvas 的浏览器。</canvas>
        <span class="board-caption" aria-hidden="true">让圆圆留在虚线下方</span>
      </div>
      <div class="board-bottomline"><span class="touch-tip">按住拖动瞄准 · 松手投放</span><span class="mouse-tip">移动瞄准 · 点击投放</span><span id="readyStatus" role="status">可以投放</span></div>
    </section>

    <aside class="panel">
      <header class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><div><p class="eyebrow">MERGE & GROW</p><h1 id="gameTitle">合成圆圆</h1></div></header>
      <section class="scorecard" aria-label="分数">
        <div class="current-score"><span class="label">本局分数</span><strong id="score" aria-live="polite">0</strong></div>
        <div class="best-score"><span class="label">本机最高分</span><strong id="best">0</strong></div>
      </section>

      <section class="next-card" aria-label="下一颗圆圆"><div><span class="label">下一个</span><p id="nextName">圆圆 01</p></div><canvas id="next" width="160" height="160" aria-label="下一颗预览"></canvas></section>

      <section class="chain-card" aria-label="合成顺序"><div class="section-heading"><span class="label">合成顺序</span><span class="chain-count">11 级</span></div><div id="chain" class="chain"></div><p class="chain-note">两个相同的，合成大一级。</p></section>

      <div class="actions"><button id="soundBtn" class="button button-secondary" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 3c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></svg><span id="soundLabel">音效开</span></button><button id="resetBtn" class="button button-primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg>重新开始</button></div>
      <p class="keyboard-tip"><kbd>←</kbd><kbd>→</kbd> 瞄准 <kbd>空格</kbd> 投放 <kbd>R</kbd> 重开</p>
      <p class="smallprint">最高分保存在当前浏览器</p>
    </aside>
  </main>

  <dialog id="overDialog" class="modal">
    <div class="result-seal" aria-hidden="true"><span>再来一次</span></div>
    <p class="eyebrow">NICE MERGE</p><h2>本局结束</h2><p class="modal-description">圆圆堆到了警戒线上方。</p>
    <span class="label">本局得分</span><strong id="finalScore" class="final-score">0</strong>
    <p class="result-best">本机最高分 <span id="finalBest">0</span><span id="newRecord" hidden> · 新纪录！</span></p>
    <button id="restartBtn" class="button button-primary" type="button">再来一局</button>
  </dialog>
  <dialog id="resetDialog" class="modal reset-modal">
    <h2>重新开始这局？</h2><p class="modal-description">当前棋盘和本局分数会清空，最高分保留。</p>
    <div class="modal-actions"><button id="cancelReset" class="button button-secondary" type="button">继续玩</button><button id="confirmReset" class="button button-primary" type="button">重新开始</button></div>
  </dialog>
</body>
</html>
